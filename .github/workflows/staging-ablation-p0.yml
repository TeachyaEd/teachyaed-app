name: Staging Ablation - P0 4-variant isolation (DEF-1/2/3A vs lvSync lifecycle)

on:
  workflow_dispatch: {}
  push:
    branches: [staging-ablation-p0-investigation]

jobs:
  ablation:
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C, D]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_SUPABASE_REF: lqyetodkoxodwjyqxukq
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEACHER_EMAIL: ${{ secrets.STAGING_TEACHER_EMAIL }}
      STAGING_TEACHER_PASSWORD: ${{ secrets.STAGING_TEACHER_PASSWORD }}
      STAGING_STUDENT_EMAIL: ${{ secrets.STAGING_STUDENT_EMAIL }}
      STAGING_STUDENT_PASSWORD: ${{ secrets.STAGING_STUDENT_PASSWORD }}
      ABLATION_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Verify required P0 credential secrets
        run: |
          missing=()
          [ -z "$STAGING_TEACHER_EMAIL" ] && missing+=("STAGING_TEACHER_EMAIL")
          [ -z "$STAGING_TEACHER_PASSWORD" ] && missing+=("STAGING_TEACHER_PASSWORD")
          [ -z "$STAGING_STUDENT_EMAIL" ] && missing+=("STAGING_STUDENT_EMAIL")
          [ -z "$STAGING_STUDENT_PASSWORD" ] && missing+=("STAGING_STUDENT_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then echo "::error::Missing: ${missing[*]}"; exit 1; fi
      - name: Install e2e-legacy dependencies
        working-directory: tests/e2e-legacy
        run: npm install
      - name: Install Playwright (Chromium only)
        working-directory: tests/e2e-legacy
        run: npx playwright install --with-deps chromium
      - name: Generate variant ${{ matrix.variant }} ephemeral staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/generate-staging-artifact-ablation.mjs ../../index.html .staging-artifact-${{ matrix.variant }}
      - name: Serve variant artifact
        working-directory: tests/e2e-legacy
        run: node ci/serve-static.mjs .staging-artifact-${{ matrix.variant }} &
      - name: Wait for local server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server not ready" >&2; exit 1
      - name: Run P0 teacher/student spec (Chromium) - variant ${{ matrix.variant }}
        working-directory: tests/e2e-legacy
        run: npx playwright test specs/p0-teacher-student.spec.ts --project=chromium --retries=0
      - name: Upload Playwright report (variant ${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-ablation-p0-${{ matrix.variant }}-report
          path: tests/e2e-legacy/playwright-report
          retention-days: 7
