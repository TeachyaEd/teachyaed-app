name: Staging E2E (legacy index.html) [Chromium P0 enabled -- not wired into required checks]

# STATUS: staging-smoke and chromium-p0 are both real, manual-dispatch-only
# jobs. Neither is added to production-regression.yml's required job chain
# yet. webkit-p0 remains a disabled placeholder until chromium-p0 is
# confirmed green for real (not just "the workflow ran").
#
# chromium-p0 runs tests/e2e-legacy/specs/p0-teacher-student.spec.ts only
# -- the first narrow authenticated P0 slice (teacher/student login,
# dashboard, opening a class with no live lesson, empty classroom shell,
# logout). It is zero-tolerance: unlike staging-smoke, it does not apply
# the 4-URL local-parser-noise allow-list, and it does not hide DB/RLS
# errors behind any allow-list.
#
# chromium-p0 requires 4 secrets (STAGING_TEACHER_EMAIL,
# STAGING_TEACHER_PASSWORD, STAGING_STUDENT_EMAIL, STAGING_STUDENT_PASSWORD)
# and staging fixture data (one school, the test teacher's profile, the
# test student's profile+students row, one class taught by the teacher
# with the student enrolled via class_students, and deliberately no
# class_lessons/lesson_assignments/class_live rows for that class). This
# is a release-quality gate, not a probe -- a missing secret must FAIL the
# job, never silently skip it. The "Verify required P0 credential secrets"
# step below fails fast, before any dependency install, if any of the 4
# are unset, naming exactly which are missing without printing values.
# The spec itself (tests/e2e-legacy/helpers/auth.ts's
# requireTeacherCredentials()/requireStudentCredentials()) enforces the
# same thing independently, so running the spec any other way still fails
# rather than skips.
#
# Intended final wiring (production-regression.yml), once this graduates:
#   static-legacy-audit -> staging-smoke -> staging-p0-chromium -> staging-p0-webkit -> production-smoke

on:
  workflow_dispatch: {}

jobs:
  staging-smoke:
    name: Staging smoke (Chromium only, pre-fixture safe)
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_REF: lqyetodkoxodwjyqxukq
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      # Bootstrap-only until a real package-lock.json exists and this
      # step is switched to `npm ci` (same sequencing used for /web:
      # see docs/DEPENDENCY_BASELINE.md). Do not switch before that.
      - name: Install e2e-legacy dependencies
        working-directory: tests/e2e-legacy
        run: npm install

      - name: Install Playwright (Chromium only)
        working-directory: tests/e2e-legacy
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/generate-staging-artifact.mjs ../../index.html .staging-artifact

      - name: Serve staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/serve-static.mjs .staging-artifact &

      - name: Wait for local server
        # Dependency-free readiness loop -- curl is guaranteed present on
        # GitHub-hosted ubuntu-latest runners. Deliberately not `npx wait-on`,
        # which is not declared in package.json and would pull an
        # undeclared package at runtime.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s" >&2
          exit 1

      - name: Run smoke spec only
        working-directory: tests/e2e-legacy
        run: npx playwright test specs/smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-report
          path: tests/e2e-legacy/playwright-report
          retention-days: 7

  chromium-p0:
    name: "Staging P0 -- Chromium (first authenticated slice)"
    needs: staging-smoke
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_REF: lqyetodkoxodwjyqxukq
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEACHER_EMAIL: ${{ secrets.STAGING_TEACHER_EMAIL }}
      STAGING_TEACHER_PASSWORD: ${{ secrets.STAGING_TEACHER_PASSWORD }}
      STAGING_STUDENT_EMAIL: ${{ secrets.STAGING_STUDENT_EMAIL }}
      STAGING_STUDENT_PASSWORD: ${{ secrets.STAGING_STUDENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Verify required P0 credential secrets
        # Fails fast, before any dependency install, if any of the 4
        # required secrets are unset. Never prints values -- only names.
        # This is a release-quality gate: a missing secret must fail the
        # job, not silently skip the tests that need it.
        run: |
          missing=()
          [ -z "$STAGING_TEACHER_EMAIL" ] && missing+=("STAGING_TEACHER_EMAIL")
          [ -z "$STAGING_TEACHER_PASSWORD" ] && missing+=("STAGING_TEACHER_PASSWORD")
          [ -z "$STAGING_STUDENT_EMAIL" ] && missing+=("STAGING_STUDENT_EMAIL")
          [ -z "$STAGING_STUDENT_PASSWORD" ] && missing+=("STAGING_STUDENT_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required staging P0 credential secret(s): ${missing[*]}. Add them under Settings > Secrets and variables > Actions before running chromium-p0."
            exit 1
          fi
          echo "All required P0 credential secrets are set."

      - name: Install e2e-legacy dependencies
        working-directory: tests/e2e-legacy
        run: npm install

      - name: Install Playwright (Chromium only)
        working-directory: tests/e2e-legacy
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/generate-staging-artifact.mjs ../../index.html .staging-artifact

      - name: Serve staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/serve-static.mjs .staging-artifact &

      - name: Wait for local server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s" >&2
          exit 1

      - name: Run P0 teacher/student spec (Chromium)
        working-directory: tests/e2e-legacy
        run: npx playwright test specs/p0-teacher-student.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-p0-chromium-report
          path: tests/e2e-legacy/playwright-report
          retention-days: 7

  webkit-p0:
    name: "[PLACEHOLDER] Staging P0 -- WebKit (disabled until Chromium P0 is green)"
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Guarded off. Enable only once chromium-p0 has passed for real against fixture data, not just executed."
