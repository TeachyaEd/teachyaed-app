name: Staging E2E (legacy index.html) [Chromium P0 + WebKit P0 + auth-04 reload + sched-01 (teacher-only) -- not wired into required checks]

# STATUS: staging-smoke, chromium-p0, and webkit-p0 are all real,
# manual-dispatch-only jobs. None is added to production-regression.yml's
# required job chain yet.
#
# 2026-09-23: webkit-p0 replaces the previous disabled placeholder now
# that chromium-p0 has run green for real against staging fixture data
# (not just "the workflow ran") -- see the Chromium P0 delivery notes for
# that evidence. webkit-p0 `needs: chromium-p0`, so it never runs unless
# chromium-p0 has already passed on this same workflow run.
#
# chromium-p0 and webkit-p0 both run the exact same
# tests/e2e-legacy/specs/p0-teacher-student.spec.ts -- same functional
# scope only (teacher/student login, dashboard, opening a class with no
# live lesson, empty classroom shell, logout), just a different Playwright
# project (chromium vs webkit, see tests/e2e-legacy/playwright.config.ts).
# No coverage expansion for this phase. Both are zero-tolerance: unlike
# staging-smoke, neither applies the 4-URL local-parser-noise allow-list,
# and neither hides DB/RLS errors behind any allow-list.
#
# The spec's one documented exception (ALLOWED_LOGOUT_ABORT in
# specs/p0-teacher-student.spec.ts, backed by AllowedRequestFailure in
# helpers/error-collectors.ts) is not project-specific by construction --
# it is evidence-gated on an exact failure string ('net::ERR_ABORTED'),
# which is a Chromium/CDP netstack error code, plus an exact prior
# response status (204) on the same request. It was added because
# Chromium's network stack has a confirmed quirk reporting a false
# 'requestfailed' after a 204 response (microsoft/playwright#42786,
# #42787). It is not disabled for webkit-p0, but it can only ever match a
# request whose failure text is exactly that Chromium-specific string --
# so it will only suppress anything for WebKit if WebKit's own network
# stack happens to produce the exact same evidence, which has not been
# assumed and must be confirmed from a real webkit-p0 run, not assumed
# from the Chromium result.
#
# chromium-p0 and webkit-p0 both require 4 secrets (STAGING_TEACHER_EMAIL,
# STAGING_TEACHER_PASSWORD, STAGING_STUDENT_EMAIL, STAGING_STUDENT_PASSWORD)
# and the same staging fixture data (one school, the test teacher's
# profile, the test student's profile+students row, one class taught by
# the teacher with the student enrolled via class_students, and
# deliberately no class_lessons/lesson_assignments/class_live rows for
# that class). This is a release-quality gate, not a probe -- a missing
# secret must FAIL the job, never silently skip it. The "Verify required
# P0 credential secrets" step in each job fails fast, before any
# dependency install, if any of the 4 are unset, naming exactly which are
# missing without printing values. The spec itself
# (tests/e2e-legacy/helpers/auth.ts's requireTeacherCredentials()/
# requireStudentCredentials()) enforces the same thing independently, so
# running the spec any other way still fails rather than skips.
#
# Neither job modifies index.html or the staging database -- both only
# read against the same fixture chromium-p0 already depends on and the
# same generate-staging-artifact.mjs-produced ephemeral copy.
#
# 2026-09-23: chromium-auth04 and webkit-auth04 add the auth-04 slice
# ("reload with valid session") via tests/e2e-legacy/specs/p0-session-reload.spec.ts.
# Deliberately separate spec and separate jobs from the classroom P0 spec --
# same credentials, same fixture, same zero-tolerance collectors, same
# single evidence-gated ALLOWED_LOGOUT_ABORT exception (duplicated locally
# in that spec, not shared), but a narrower functional scope: login,
# page.reload(), prove the existing session is restored without
# re-authenticating and the role-appropriate landing screen renders, then
# logout. No expired-session coverage (auth-05, not implemented here). No
# staging fixture data is created or mutated, and index.html/DB/RLS/Realtime
# are untouched -- reload() only exercises the client-side session Supabase
# already persisted.
#
# chromium-auth04 `needs: chromium-p0` (only runs after the classroom
# Chromium P0 job has already passed on this run) rather than
# staging-smoke directly, since it needs the same authenticated-session
# preconditions chromium-p0 already establishes are reachable. webkit-auth04
# `needs: chromium-auth04`, so it never runs unless the Chromium auth-04
# slice itself has passed. The existing staging-smoke, chromium-p0, and
# webkit-p0 (classroom) jobs are unchanged by this addition.
#
# 2026-09-23: chromium-sched01 and webkit-sched01 add the sched-01 slice
# ("schedule reads/loads") via tests/e2e-legacy/specs/p0-schedule-read.spec.ts.
# Strictly read-only -- no schedule_events row is created, updated, or
# deleted. Teacher only: source-tracing found no student-facing schedule
# NAV entry and no reachable UI path for the student role (see that
# spec's own header comment for the full source evidence) -- the student
# half is deliberately deferred/uncovered, not implemented via any
# synthetic navigation path, and index.html/NAV is untouched.
#
# chromium-sched01 `needs: chromium-p0` (same authenticated-session
# precondition as chromium-auth04, not chained through auth-04 itself,
# since sched-01 has no dependency on the reload slice). webkit-sched01
# `needs: chromium-sched01`. The existing staging-smoke, chromium-p0,
# webkit-p0, chromium-auth04, and webkit-auth04 jobs are unchanged by
# this addition.
#
# Intended final wiring (production-regression.yml), once this graduates:
#   static-legacy-audit -> staging-smoke -> staging-p0-chromium -> staging-p0-webkit -> staging-auth04-chromium -> staging-auth04-webkit -> staging-sched01-chromium -> staging-sched01-webkit -> production-smoke

on:
  workflow_dispatch: {}

jobs:
  staging-smoke:
    name: Staging smoke (Chromium only, pre-fixture safe)
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_REF: lqyetodkoxodwjyqxukq
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      # Bootstrap-only until a real package-lock.json exists and this
      # step is switched to `npm ci` (same sequencing used for /web:
      # see docs/DEPENDENCY_BASELINE.md). Do not switch before that.
      - name: Install e2e-legacy dependencies
        working-directory: tests/e2e-legacy
        run: npm install

      - name: Install Playwright (Chromium only)
        working-directory: tests/e2e-legacy
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/generate-staging-artifact.mjs ../../index.html .staging-artifact

      - name: Serve staging artifact
        working-directory: tests/e2e-legacy
        run: node ci/serve-static.mjs .staging-artifact &

      - name: Wait for local server
        # Dependency-free readiness loop -- curl is guaranteed present on
        # GitHub-hosted ubuntu-latest runners. Deliberately not `npx wait-on`,
        # which is not declared in package.json and would pull an
        # undeclared package at runtime.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ -o /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 30s" >&2
          exit 1

      - name: Run smoke spec only
        working-directory: tests/e2e-legacy
        run: npx playwright test specs/smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-report
          path: tests/e2e-legacy/playwright-report
          retention-days: 7

  chromium-p0:
    name: "Staging P0 -- Chromium (first authenticated slice)"
    needs: staging-smoke
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_REF: lqyetodkoxodwjyqxukq
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEACHER_EMAIL: ${{ secrets.STAGING_TEACHER_EMAIL }}
      STAGING_TEACHER_PASSWORD: ${{ secrets.STAGING_TEACHER_PASSWORD }}
      STAGING_STUDENT_EMAIL: ${{ secrets.STAGING_STUDENT_EMAIL }}
      STAGING_STUDENT_PASSWORD: ${{ secrets.STAGING_STUDENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Verify required P0 credential secrets
        # Fails fast, before any dependency install, if any of the 4
        # required secrets are unset. Never prints values -- only names.
        # This is a release-quality gate: a missing secret must fail the
        # job, not silently skip the tests that need it.
        run: |
          missing=()
          [ -z "$STAGING_TEACHER_EMAIL" ] && missing+=("STAGING_TEACHER_EMAIL")
          [ -z "$STAGING_TEACHER_PASSWORD" ] && missing+=("STAGING_TEACHER_PASSWORD")
          [ -z "$STAGING_STUDENT_EMAIL" ] && missing+=("STAGING_STUDENT_EMAIL")
          [ -z "$STAGING_STUDENT_PASSWORD" ] && missing+=("STAGING_STUDENT_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required staging P0 credential secret(s): ${missing[*]}. Add them under Settings > Secrets and variables > Actions before running chromium-p0."
            exit 1
          fi
          echo "All required P0 credential secrets are set."

      - name: Install e2e-legacy dependencies
        working-directory: tests/e2e-legacy
        run: npm install

      - name: Install Playwright (Chromium only)
        working-directory: tests/e2e-legacy
